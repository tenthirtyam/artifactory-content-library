---
version: 2

project_name: artifactory-content-library

before:
  hooks:
    - go mod tidy

builds:
  - id: artifactory-content-library
    main: .
    binary: artifactory-content-library
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE.md
      - README.md
      - schema/config.schema.json

checksum:
  name_template: "{{ .ProjectName }}_v{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: tenthirtyam
    name: artifactory-content-library
  draft: false
  prerelease: auto

snapshot:
  version_template: "{{ .Tag }}-next"

brews:
  - name: artifactory-content-library
    repository:
      owner: tenthirtyam
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/tenthirtyam/artifactory-content-library"
    description: "Generate vSphere content library metadata for JFrog Artifactory"
    license: "MIT"
    skip_upload: auto
    test: |
      assert_match version.to_s, shell_output("#{bin}/artifactory-content-library --version")

