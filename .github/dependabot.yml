---
version: 2

updates:
  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/.github/workflows'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(ci):'
      include: 'scope'
    labels:
      - 'chore'
      - 'github-actions'
    groups:
      github-actions:
        patterns:
          - '*'

  # Go Modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "chore"
      - "dependencies"
