---
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-lint:
    runs-on: ubuntu-latest
    name: Check Lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2

  check-mod-tidy:
    runs-on: ubuntu-latest
    name: Check Tidy
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Tidy
        run: go mod tidy
      - name: Verify Tidy
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "go.mod/go.sum are not tidy."
            echo "Run: go mod tidy"
            exit 1
          fi

  check-format:
    runs-on: ubuntu-latest
    name: Check Format
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Format
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "The following files are not properly formatted:"
            echo "$files"
            echo
            echo "Run: gofmt -w ."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    name: Run Unit Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: make test-unit
      - name: Build
        run: make build

  test-integration:
    runs-on: ubuntu-latest
    name: Run Integration Tests
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Integration Tests
        env:
          USE_DOCKER: "1"
          INTEGRATION_FRESH: "1"
          TEARDOWN_AFTER: "1"
        run: make test-integration
